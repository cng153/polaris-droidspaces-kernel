name: Build polaris Droidspaces kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zip unzip cpio python3 device-tree-compiler lz4 xz-utils
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone LineageOS sdm845 kernel
        run: |
          git clone --depth 1 -b lineage-22.2 https://github.com/LineageOS/android_kernel_xiaomi_sdm845.git kernel
          cd kernel
          echo "== HEAD =="
          git log -1 --oneline
          echo "== polaris configs =="
          find arch/arm64/configs -iname '*polaris*' | head -10

      - name: Configure with Droidspaces options
        run: |
          cd kernel
          BASE=$(find arch/arm64/configs -iname '*polaris*defconfig' | head -1)
          echo "BASE=$BASE"
          test -n "$BASE"
          cp "$BASE" arch/arm64/configs/ds_build_defconfig
          cat >> arch/arm64/configs/ds_build_defconfig <<'EOF'

          # ---- Droidspaces container support ----
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_NET_NS=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y
          CONFIG_FUSE_FS=y
          CONFIG_TUN=y
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_EXT4_FS=y
          EOF
          make ARCH=arm64 ds_build_defconfig
          make ARCH=arm64 olddefconfig

      - name: Verify required options
        run: |
          cd kernel
          FAIL=0
          for o in PID_NS IPC_NS UTS_NS USER_NS NET_NS NAMESPACES SECCOMP CGROUPS DEVTMPFS OVERLAY_FS VETH SYSVIPC POSIX_MQUEUE MEMCG BLK_DEV_LOOP EXT4_FS; do
            if grep -q "^CONFIG_$o=y" .config; then echo "OK   $o"; else echo "MISS $o"; FAIL=1; fi
          done
          echo "---- kernel version ----"
          make ARCH=arm64 kernelversion
          echo "FAIL=$FAIL"

      - name: Build kernel
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-error" -j$(nproc) Image.gz-dtb 2>&1 | tail -60
          echo "==== boot dir ===="
          ls -lh arch/arm64/boot/

      - name: Build out-of-tree modules and stage
        run: |
          cd kernel
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) modules 2>&1 | tail -30 || true
          mkdir -p /tmp/modules
          find . -name '*.ko' -exec cp {} /tmp/modules/ \; 2>/dev/null || true
          ls /tmp/modules | head -20
          ls /tmp/modules | wc -l

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          rm -f Image* zImage* dtb* *.ko
          if [ -f ../kernel/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/arch/arm64/boot/Image.gz .
          else
            cp ../kernel/arch/arm64/boot/Image .
          fi
          cp /tmp/modules/*.ko . 2>/dev/null || true
          sed -i 's/^kernel.string=.*/kernel.string=polaris droidspaces kernel/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=polaris/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=/; s/^device.name3=.*/device.name3=/; s/^device.name4=.*/device.name4=/; s/^device.name5=.*/device.name5=/' anykernel.sh
          cat anykernel.sh | head -40
          zip -r9 ../polaris-droidspaces-kernel.zip * -x .git/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: polaris-droidspaces-kernel
          path: polaris-droidspaces-kernel.zip
          if-no-files-found: error
