name: Build polaris Droidspaces kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev \
            make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zip unzip cpio python3 device-tree-compiler lz4 xz-utils
          aarch64-linux-gnu-gcc --version | head -1
          nproc; free -m

      - name: Clone LineageOS sdm845 kernel
        run: |
          git clone --depth 1 -b lineage-22.2 https://github.com/LineageOS/android_kernel_xiaomi_sdm845.git kernel
          cd kernel
          git log -1 --oneline
          ls drivers/bluetooth/btfm_slim*

      - name: Merge configs
        run: |
          cd kernel
          BASE=arch/arm64/configs/vendor/sdm845_defconfig
          FRAG=arch/arm64/configs/vendor/xiaomi/polaris.config
          test -f "$BASE"
          test -f "$FRAG"
          cat > /tmp/ds.fragment <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_NET_NS=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_MEMCG=y
          CONFIG_MEMCG_SWAP=y
          CONFIG_MEMCG_SWAP_ENABLED=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y
          CONFIG_FUSE_FS=y
          CONFIG_TUN=y
          CONFIG_BLK_DEV_LOOP=y
          CONFIG_EXT4_FS=y
          CONFIG_EXT4_FS_POSIX_ACL=y
          CONFIG_PM=y
          CONFIG_SMP=y
          CONFIG_SUSPEND=y
          CONFIG_PM_SLEEP=y
          CONFIG_PM_SLEEP_SMP=y
          CONFIG_PM_DEBUG=y
          CONFIG_PM_WAKELOCKS=y
          # CONFIG_EFI is not set
          # CONFIG_EFI_STUB is not set
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_WEXT_CORE=y
          CONFIG_WEXT_PRIV=y
          CONFIG_ICNSS=y
          CONFIG_QCA_CLD_WLAN=y
          EOF
          export ARCH=arm64
          chmod +x scripts/kconfig/merge_config.sh
          if ./scripts/kconfig/merge_config.sh -m "$BASE" "$FRAG" /tmp/ds.fragment > /tmp/merge.log 2>&1; then
            echo "MERGED via merge_config.sh"
          else
            echo "FALLBACK: plain concat"
            cat "$BASE" "$FRAG" /tmp/ds.fragment > .config
          fi
          tail -5 /tmp/merge.log || true
          make ARCH=arm64 olddefconfig 2>&1 | tail -8
          echo "olddefconfig_rc=${PIPESTATUS[0]}"
          grep -E "^CONFIG_(PM|SMP|SUSPEND|PM_SLEEP|PID_NS|UTS_NS|IPC_NS|USER_NS|NET_NS|SYSVIPC|CGROUPS|MEMCG|OVERLAY_FS|VETH|DEVTMPFS|SECCOMP|BTFM_SLIM)=" .config | sort | head -40

      - name: Build Image.gz
        run: |
          cd kernel
          EXTRA_INCS="-I$PWD/drivers/bluetooth -I$PWD/drivers/usb/phy -I$PWD/drivers/usb/gadget -I$PWD/techpack/audio/include -I$PWD/techpack/audio/asoc -I$PWD/drivers/clk/qcom/mdss -I$PWD/drivers/gpu/msm -I$PWD/drivers/platform/msm/ipa -I$PWD/drivers/platform/msm/ipa/ipa_v3 -I$PWD/drivers/platform/msm/ipa/ipa_clients -I$PWD/drivers/power/supply/qcom -I$PWD/drivers/soc/qcom"
          CAM_INCS=$(find drivers/media/platform/msm/camera drivers/media/platform/msm/camera_v3 techpack/audio -type d 2>/dev/null | sed "s|^|-I$PWD/|" | tr '\n' ' ')
          echo "camera/audio subdir include count: $(echo $CAM_INCS | wc -w)"
          set +e
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error -Wno-error=implicit-function-declaration -Wno-implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=misleading-indentation -Wno-error=attribute-warning -Wno-error=maybe-uninitialized -Wno-error=unused-variable" \
            KBUILD_MODPOST_WARN=1 \
            KCPPFLAGS="$EXTRA_INCS $CAM_INCS" \
            -k -j$(nproc) Image.gz > /tmp/build.log 2>&1
          RC=$?
          echo "make_exit=$RC"
          if [ $RC -ne 0 ]; then
            echo "========== ERROR SUMMARY =========="
            echo "total error lines: $(grep -cE 'error:|Error [0-9]' /tmp/build.log || true)"
            echo "========== FIRST ERRORS (with context) =========="
            grep -nE -B6 -A10 "error:|Error [0-9]|No rule to make target" /tmp/build.log | head -200
            echo "========== END OF ERRORS =========="
            echo "========== LAST 90 LINES OF LOG =========="
            tail -90 /tmp/build.log
            free -m
            exit 1
          fi
          tail -20 /tmp/build.log
          ls -lh arch/arm64/boot/Image.gz

      - name: Build dtbs and append
        run: |
          cd kernel
          set +e
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) dtbs >> /tmp/build.log 2>&1
          echo "dtbs_exit=$?"
          echo "polaris dtb count: $(ls arch/arm64/boot/dts/qcom/ 2>/dev/null | grep -ci polaris)"
          ls arch/arm64/boot/dts/qcom/ 2>/dev/null | grep -i polaris
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz-dtb >> /tmp/build.log 2>&1
          echo "imgdtb_exit=$?"
          tail -40 /tmp/build.log
          ls -lh arch/arm64/boot/

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          rm -f Image* zImage* dtb* *.ko
          SRC=../kernel/arch/arm64/boot/Image.gz-dtb
          if [ ! -f "$SRC" ]; then SRC=../kernel/arch/arm64/boot/Image.gz; fi
          cp "$SRC" ./Image.gz-dtb
          ls -lh Image.gz-dtb
          sed -i 's/^kernel.string=.*/kernel.string=polaris droidspaces kernel/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=polaris/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=/; s/^device.name3=.*/device.name3=/; s/^device.name4=.*/device.name4=/; s/^device.name5=.*/device.name5=/' anykernel.sh
          head -20 anykernel.sh
          zip -r9 ../polaris-droidspaces-kernel.zip * -x .git/*

      - name: Diagnostics on failure
        if: failure()
        run: |
          free -m
          df -h
          tail -200 /tmp/build.log || true

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: polaris-droidspaces-kernel
          path: polaris-droidspaces-kernel.zip
          if-no-files-found: error
